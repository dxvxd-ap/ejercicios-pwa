<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediRegistro PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
</head>

<body class="bg-gray-900 text-gray-100 font-sans antialiased flex flex-col min-h-screen pb-16 md:pb-0">

    <!-- 1. HEADER (Cabecera del App Shell) -->
    <header class="bg-gray-800 border-b border-gray-700 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gray-700 p-2 rounded-lg border border-gray-600">
                    <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4">
                        </path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-wider text-white">MediRegistro</h1>
            </div>

            <!-- Menú de navegación Desktop (Oculto en celulares) -->
            <nav class="hidden md:flex gap-6">
                <a href="#" class="text-indigo-400 font-semibold border-b-2 border-indigo-500 pb-1">Inicio</a>
                <a href="#" class="text-gray-400 hover:text-gray-200 transition-colors">Pacientes</a>
                <a href="#" class="text-gray-400 hover:text-gray-200 transition-colors">Ajustes</a>
            </nav>
        </div>
    </header>

    <!-- 2. CONTENEDOR PRINCIPAL (Donde irá el contenido dinámico) -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full flex flex-col">
        <div
            class="bg-gray-800/50 rounded-2xl border-2 border-gray-700 border-dashed p-6 flex-grow flex items-center justify-center">
            <div class="text-center">
                <p class="text-gray-400 text-lg font-medium">Contenedor Principal del App Shell</p>
                <p class="text-gray-500 text-sm mt-2">Aquí se inyectarán las vistas y formularios</p>
            </div>
        </div>
    </main>

    <!-- 3. MENÚ DE NAVEGACIÓN MÓVIL (Bottom Nav para celulares) -->
    <nav class="md:hidden bg-gray-800 border-t border-gray-700 fixed bottom-0 w-full z-50 pb-safe">
        <div class="flex justify-around py-3">
            <a href="#" class="flex flex-col items-center text-indigo-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                <span class="text-[10px] font-semibold mt-1">Inicio</span>
            </a>
            <a href="#" class="flex flex-col items-center text-gray-500 hover:text-gray-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                    </path>
                </svg>
                <span class="text-[10px] font-semibold mt-1">Pacientes</span>
            </a>
            <a href="#" class="flex flex-col items-center text-gray-500 hover:text-gray-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="text-[10px] font-semibold mt-1">Ajustes</span>
            </a>
        </div>
    </nav>

    <script src="app.js"></script>
</body>

</html>
